name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # Bundle-size gate: download the base branch's size report, read the PR's size-increase notes.
      actions: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format Check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Script Tests
        run: pnpm test:scripts

      - name: Benchmark Regression Gate
        run: pnpm bench:ci

      - name: Upload Benchmark Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-report
          path: benchmarks/last-ci-report.json
          if-no-files-found: ignore

      - name: Build
        run: pnpm build

      - name: Fetch Bundle Size Baseline
        id: bundle-baseline
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          dir="$RUNNER_TEMP/bundle-size"
          mkdir -p "$dir"
          # `size-increase:` notes come from the PR body (read live, so an edited body counts on
          # re-run) and from the PR's commit messages.
          {
            gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq '.body // ""'
            gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/commits" --jq '.[].commit.message'
          } > "$dir/notes.txt" || echo "::warning::Could not read the PR body or commits for size-increase notes"
          # Baseline: the size report of the base commit's CI run, else the newest base-branch run
          # that uploaded one. Push CI only runs on main, so stacked PRs get no delta check.
          runs=$({
            gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch "$BASE_REF" --event push --commit "$BASE_SHA" --json databaseId --jq '.[].databaseId'
            gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch "$BASE_REF" --event push --limit 20 --json databaseId --jq '.[].databaseId'
          } || true)
          for run in $runs; do
            if gh run download "$run" --repo "$GITHUB_REPOSITORY" --name bundle-size-report --dir "$dir/baseline-$run" 2>/dev/null; then
              echo "Bundle-size baseline: CI run $run on $BASE_REF"
              echo "report=$dir/baseline-$run/latest-report.json" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "::notice::No bundle-size baseline for $BASE_REF; only absolute page-bundle budgets are checked"

      - name: Bundle Size Gate
        env:
          BASELINE_REPORT: ${{ steps.bundle-baseline.outputs.report }}
        run: |
          args=()
          if [ -n "$BASELINE_REPORT" ]; then args+=(--baseline "$BASELINE_REPORT"); fi
          if [ -f "$RUNNER_TEMP/bundle-size/notes.txt" ]; then args+=(--notes-file "$RUNNER_TEMP/bundle-size/notes.txt"); fi
          node scripts/check-bundle-size.mjs "${args[@]}"

      - name: Upload Bundle Size Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bundle-size-report
          path: bundle-size/latest-report.json
          if-no-files-found: ignore

  product-matrix:
    name: ${{ matrix.surface }} gate
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - surface: core
            command: pnpm coverage:core
            needsChrome: false
          - surface: share
            command: pnpm --filter @webblackbox/share-server e2e:share
            needsChrome: false
          - surface: player
            command: pnpm --filter @webblackbox/player e2e:playback
            needsChrome: true
          - surface: player-pressure
            command: pnpm --filter @webblackbox/player-sdk test:pressure
            needsChrome: false
          - surface: lite
            command: pnpm --filter @webblackbox/extension e2e:realworld:ci
            needsChrome: true
          - surface: lite-perf
            command: pnpm --filter @webblackbox/extension e2e:perf:lite:ci
            needsChrome: true
          - surface: full-isolation
            command: pnpm --filter @webblackbox/extension e2e:isolation:full
            needsChrome: true
          - surface: full
            command: pnpm --filter @webblackbox/extension e2e:fullchain:full
            needsChrome: true
          - surface: full-completeness
            command: pnpm --filter @webblackbox/extension e2e:completeness:full
            needsChrome: true
          - surface: full-completeness-reload
            command: pnpm --filter @webblackbox/extension e2e:completeness:full:reload
            needsChrome: true
          - surface: full-memory
            command: pnpm --filter @webblackbox/extension e2e:memory:full:ci
            needsChrome: true
          - surface: tabs-context
            command: pnpm --filter @webblackbox/extension e2e:tabs-context
            needsChrome: true
          - surface: ui
            command: WB_UI_SHOTS_OUT=/tmp/wb-ui-shots pnpm --filter @webblackbox/extension e2e:ui
            needsChrome: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Chrome for Testing
        if: ${{ matrix.needsChrome }}
        timeout-minutes: 5
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace
        run: pnpm build

      - name: Product surface gate (${{ matrix.surface }})
        env:
          WB_E2E_CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          WB_E2E_HEADLESS: "1"
          WB_E2E_USE_POPUP_UI: "0"
        run: ${{ matrix.command }}

      - name: Upload UI screenshots
        if: ${{ failure() && matrix.surface == 'ui' }}
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: /tmp/wb-ui-shots
